name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # agent-supervisor#380: no timeout was set, so a stalled run fell back to
    # GitHub's 360min default -- confirmed against two runs on 2026-08-18
    # (32093245625, 32087480740) that each ran the full 360.3/360.4min before
    # being auto-cancelled, with no test output either time. The real suite,
    # measured across recent completed runs on 2026-08-19, takes 19m33s-21m34s
    # end to end -- 30 gives headroom above that without leaving a hang
    # effectively unbounded again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m unittest discover -s tests -v
