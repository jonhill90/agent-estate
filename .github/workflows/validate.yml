name: Validate

# agent-supervisor#407: `pull_request` alone goes silent -- not slow, not
# queued, ZERO check runs -- for any PR GitHub cannot compute a merge commit
# for (`mergeable: CONFLICTING`). `pull_request`'s default dispatch runs
# against `refs/pull/<n>/merge`; when that ref can't be built, GitHub never
# fires the event at all, which from outside is indistinguishable from a
# dropped webhook delivery. Measured directly against PR #404 (2026-08-20):
# every open PR with `mergeable: MERGEABLE` had 4 check runs at its head
# SHA; the one PR with `mergeable: CONFLICTING` had 0 -- confirmed across
# every commit it had received, including a fresh empty "nudge" commit
# pushed specifically to rule out a one-off dropped delivery. `push` used to
# carry no `branches:` filter at all so it would dispatch off the pushed SHA
# directly, independent of the merge-ref computation, regardless of the
# PR's mergeable state.
#
# agent-supervisor#579: that unfiltered `push` also fires for every ordinary
# (mergeable) PR push, on top of the `pull_request` run the same SHA already
# gets -- measured as steady-state `push=1 pull_request=1` on every sampled
# branch-push SHA, not an occasional flake. Restricting `push` to `main`
# fixes that: PR branches now get exactly one run (`pull_request`), and
# `main` -- which never carries an open PR against itself -- keeps running
# on every push, squash-merged or not.
#
# This DOES narrow the #407 fix: a push to a PR branch that is *itself*
# unmergeable (`mergeable: CONFLICTING`) no longer has `push` as a fallback,
# so it is back to zero check runs until a later commit resolves the
# conflict -- the original #407 symptom, for that one case only. Flagged
# explicitly rather than silently reintroduced; see the PR that made this
# change for the reasoning on why that residual gap was accepted rather
# than closed with a same-SHA dedup guard.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# agent-supervisor#440: this used to be one `test` job running
# `python -m unittest discover -s tests -v` -- 801 Python tests plus 89 bash
# integration suites, the bash ones executed *serially inside a single
# Python test* (test_shell_suites.py::test_shell_suites_pass). Measured
# directly against a real run (32415643900, instrumented with a per-suite
# timing print): the 89 bash suites took 1306.1s of the ~1330s total --
# 99%+ of CI's 22 minutes was that one test, and within it the distribution
# was concentrated-with-a-long-tail, not either extreme (top 10 suites =
# 68% of the time, but the remaining 79 are not negligible at ~5.4s
# average) -- which is what calls for balanced-by-time bin-packing across
# several shards, not carving "the slow ones" into their own job while the
# rest of the 89 stay serial. `plan-shell-shards` bin-packs the *currently
# discovered* test_*.sh files (never a static list) into 5 shards, each
# landing within a few tenths of a second of the others
# (scripts/ci/plan_shell_shards.py). The 801 Python tests run in their own
# job in parallel with those shards instead of waiting behind them.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # agent-estate#805: test_lane_worktree_reap.py drives the REAL
      # `worktree.sh reap` (agent-estate#804), whose `_gc_is_live` guard
      # asks a real `tmux` binary "is any pane's cwd inside this worktree"
      # before it will ever call a case "safe to remove". Without tmux on
      # PATH at all, that ask can't be answered ("could not query tmux
      # panes"), and the guard fails closed -- refusing the very
      # clean/merged cases the mutation suite expects reaped, at THIS job
      # only: shell-suites already installs tmux for the same reason,
      # unit-tests never did because nothing here shelled out to it before
      # #804 landed.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m unittest discover -s tests -v
        env:
          # The 89 bash suites run in the shell-suites shards below, not
          # here -- without this, this job would run all 89 serially AGAIN
          # on top of the sharded jobs, buying nothing.
          SHELL_SUITE_SKIP: "1"

  plan-shell-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_suites: ${{ steps.plan.outputs.total_suites }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: plan
        run: |
          python3 scripts/ci/plan_shell_shards.py 5 > /tmp/plan.json
          echo "matrix=$(python3 -c 'import json; print(json.dumps(json.load(open("/tmp/plan.json"))["matrix"]))')" >> "$GITHUB_OUTPUT"
          echo "total_suites=$(python3 -c 'import json; print(json.load(open("/tmp/plan.json"))["total_suites"])')" >> "$GITHUB_OUTPUT"

  shell-suites:
    needs: plan-shell-shards
    runs-on: ubuntu-latest
    name: shell-suites (shard ${{ matrix.shard.shard }})
    # agent-supervisor#380: the real suite, measured end to end, ran
    # 19m33s-21m34s before this split. A single shard's bin-packed share is
    # ~261s of suite time plus setup/tmux-install overhead -- 15 gives ample
    # headroom above that without leaving a hang effectively unbounded.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-shell-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python -m unittest tests.supervisor.test_shell_suites -v
        env:
          # #440 fix: join(..., '\n') emits a literal backslash-n, not a real
          # newline -- GH Actions expression strings don't interpret escapes.
          # Confirmed directly against run 32418135347: every shard's
          # SHELL_SUITE_ONLY was one unsplit string with literal \n bytes, so
          # every name failed the exists-on-disk check and every shard
          # RuntimeError'd before running a single suite. Comma has no such
          # escaping problem and no suite name contains one.
          SHELL_SUITE_ONLY: ${{ join(matrix.shard.suites, ',') }}
