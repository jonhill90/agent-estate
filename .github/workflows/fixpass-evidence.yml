name: Fixpass evidence

# agent-supervisor#338: a fix pass that claims a defect is gone without
# pasting the reviewer's own reproduction re-run leaves the re-reviewer to
# re-derive everything -- a full fresh review where a check would do. This
# is what makes that enforced rather than remembered: it runs on every PR,
# and fails one that has a REQUEST CHANGES review or a rejected `Verdict:`
# comment on record but no populated `<!-- fixpass-evidence:v1 -->` block
# anywhere in the body or comments. See
# scripts/supervisor/fixpass_evidence_gate.py for the check itself and
# tests/supervisor/test_fixpass_evidence_gate.py for its own tests (stubbed
# `gh`, no network).
#
# This is the whole mechanism -- no change to merge-pr.sh was needed.
# ci_gate.py (agent-supervisor#13) already refuses to merge past any red
# required check at the live head SHA; wiring this in as a check reuses that
# refusal instead of duplicating it.
#
# Two triggers, not one, mirroring ui-evidence.yml (#110): a push updates the
# diff, but evidence is commonly posted as a follow-up comment after review
# -- without issue_comment, a PR that added evidence by commenting would
# stay red until an unrelated push re-ran the check.
#
# agent-supervisor#597: for an issue_comment event, GitHub associates the
# run's own status with the DEFAULT BRANCH TIP at trigger time (github.sha
# and the run's head_sha both resolve there), never the PR's actual head --
# the same #468 finding ui-evidence.yml already corrected for its own gate.
# Relying on the job's implicit pass/fail therefore posted this gate's
# result on a commit nobody was merging, leaving fixpass-gate red for nine
# hours across three evidence comments on #576 even though the evidence had
# already answered the rejection 44 seconds after it was measured -- proven
# by re-running the same failed job by hand and getting SUCCESS with no
# change to the branch. The issue_comment step below does not rely on that
# implicit status: it reuses ui-evidence-report.sh (already generic over
# which gate it drives, via UI_EVIDENCE_GATE_BIN) through the
# fixpass-evidence-gate.sh adapter, which resolves the PR's head SHA itself
# and explicitly publishes a check-run against it via the Checks API --
# that is the only thing ci_gate.py reads (commits/{sha}/check-runs,
# SHA-scoped), so it is what actually makes a comment-only evidence post
# turn this PR's gate green.
#
# agent-supervisor#565: this job used to be named `gate`, same as
# ui-evidence.yml's job -- both check-runs then displayed as the bare name
# `gate` in `gh pr checks`'s flat output, indistinguishable without opening
# each run's URL. Renamed to `fixpass-gate` so the two are unambiguous.
# ui-evidence.yml's job stays `gate`: ci_gate.py's
# `_gate_superseded_by_ui_evidence` matches that literal name, and renaming
# it would require updating that function (and its tests) too -- out of
# scope for this small fix.
#
# agent-estate#811: the issue_comment trigger above already re-evaluates
# when evidence arrives (that part was never the bug), but it re-evaluates
# on EVERY comment, not just one that could change the answer. #811
# originally claimed this raced twice on #810; #812's reviewer matched
# every fixpass-evidence.yml run against #810 to its triggering comment and
# log line and found ONE genuine race, not two (see #811's correction
# comment, #812's PR body): the 11:48:52 "fix pass" narration comment (no
# marker) re-ran the gate, which (correctly, at that instant) found no
# evidence yet and published an explicit FAILURE check-run seconds before
# the real evidence comment posted at 11:51:43. The second incident cited
# in the original filing (a FAILURE at 12:13:52) was NOT a race: that
# comment carried the marker but was itself malformed (missing its `exit
# code:` line), so the gate was correct to not count it -- confirmed by the
# author lane's own 12:15:52 re-post. The genuine race resolved itself the
# moment the real evidence comment posted (its own issue_comment run always
# saw itself) -- the actual defect was the one spurious extra failure in
# between, which is what forced a manual `gh run rerun` and left two
# same-named check-runs on the PR to read.
#
# Chose OPTION 1 (filtered), not option 2 (grace window) or option 3
# (post-before-push convention): fixpass_evidence_gate.py's own evaluate()
# can only be swayed by a comment carrying the literal EVIDENCE_MARKER or a
# `Verdict:` line (`_is_rejected_verdict_comment` requires one); a comment
# with neither is a structural no-op for the gate, so skipping evaluation
# for it cannot hide a real answer -- see
# scripts/supervisor/fixpass-comment-relevant.sh for the filter and its own
# reasoning about why this is a safe superset match, not a guess. A grace
# window (option 2) would slow down every GENUINE failure by an arbitrary
# N with no such guarantee; option 3 depends on every lane getting an
# ordering right that nothing enforces, and does not by itself stop an
# unrelated narration comment from re-triggering a fail (the actual
# mechanism observed on #810 was never about push order).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  # Needed only by the issue_comment step, to publish an explicit
  # check-run against the PR's real head SHA (see #597 above).
  checks: write

jobs:
  fixpass-gate:
    # issue_comment fires for both issues and PRs; only a PR comment has
    # `issue.pull_request` set. Skip anything else so this never runs
    # against a plain issue thread (Issues is degraded in this estate
    # anyway -- see CLAUDE.md).
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # pull_request: github.sha already is the PR's head at trigger time,
      # so the job's own implicit status-to-commit association is correct
      # here -- no need to route around it.
      - name: Check fixpass evidence (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/supervisor/fixpass_evidence_gate.py --repo "${{ github.repository }}" --number "${{ github.event.pull_request.number }}"
      # agent-estate#811: skip re-evaluation for a comment that structurally
      # cannot change the gate's answer (see the header comment above and
      # fixpass-comment-relevant.sh). COMMENT_BODY is passed via env, never
      # interpolated into the script text -- untrusted comment content
      # inline in a `run:` block is a script-injection vector.
      - name: Is this comment relevant to fixpass evidence? (agent-estate#811)
        id: relevance
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if printf '%s' "$COMMENT_BODY" | bash scripts/supervisor/fixpass-comment-relevant.sh; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "fixpass-gate: comment carries neither the evidence marker nor a Verdict: line -- cannot change the gate's answer, skipping re-evaluation (agent-estate#811)"
          fi
      # issue_comment: see the #597 correction above -- publish the result
      # explicitly against the PR's real head SHA instead of trusting the
      # run's own (wrong) head_sha.
      - name: Check fixpass evidence (issue_comment, explicit head SHA)
        if: github.event_name == 'issue_comment' && steps.relevance.outputs.relevant == 'true'
        env:
          UI_EVIDENCE_GATE_BIN: scripts/supervisor/fixpass-evidence-gate.sh
          UI_EVIDENCE_CHECK_NAME: fixpass-gate
        run: |
          bash scripts/supervisor/ui-evidence-report.sh "${{ github.event.issue.number }}"
