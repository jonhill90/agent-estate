name: estate-ci
on: [push, pull_request]
jobs:
  estate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build
        run: go build ./src/estate/...
      - name: vet
        run: go vet ./src/estate/...
      - name: test
        run: go test ./src/estate/...
