name: langguard
on: [push, pull_request]
jobs:
  langguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.x'
      - name: The app is Go - no shell or Python outside reference/
        run: go run ./src/langguard
