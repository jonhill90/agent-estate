name: UI evidence

# #110: a UI change asserted without a captured frame is not reviewable.
# This is what makes that enforced rather than remembered -- it runs on
# every PR, and fails one that touches a UI path (scripts/supervisor/laneview/)
# without a `<!-- ui-evidence:v1 -->` marker carrying a look.py capture in
# the PR body or a comment. See scripts/supervisor/ui-evidence-gate.sh for
# the check itself and tests/supervisor/test_ui_evidence_gate.sh for its
# own tests (stubbed gh, no network).
# Two triggers, not one: a push updates the diff, but evidence is commonly
# posted as a follow-up comment after review asks for it (the gate's own
# test covers exactly that case) -- without issue_comment, a PR that fixed
# itself by commenting would stay red until an unrelated push re-ran the
# check.
#
# CORRECTED (#468): for an issue_comment event, GitHub associates the run's
# own status with the DEFAULT BRANCH TIP at trigger time (github.sha and
# the run's head_sha both resolve there), never the PR's actual head --
# regardless of what actions/checkout fetches inside the job. That
# association can't be redirected by checking out a different ref. Relying
# on the job's implicit pass/fail therefore posted the gate's result on a
# commit nobody was merging, and the PR's real head never saw it (measured
# on #467, see the issue). The issue_comment step below does not rely on
# that implicit status: it resolves the PR's head SHA itself and
# explicitly publishes a check-run against it via the Checks API
# (scripts/supervisor/ui-evidence-report.sh) -- that is the only thing
# ci_gate.py reads (commits/{sha}/check-runs, SHA-scoped), so it is what
# actually makes a comment-only evidence post turn a PR's gate green.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  # Needed only by the issue_comment step, to publish an explicit
  # check-run against the PR's real head SHA (see #468 above).
  checks: write

jobs:
  gate:
    # issue_comment fires for both issues and PRs; only a PR comment has
    # `issue.pull_request` set. Skip anything else so this never runs
    # against a plain issue thread.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Which paths count as UI is config, not something the gate
      # script hardcodes (see its header: laneview/README.md rule 3).
      UI_EVIDENCE_PATH_RE: scripts/supervisor/laneview/
    steps:
      - uses: actions/checkout@v5
      # pull_request: github.sha already is the PR's head at trigger time,
      # so the job's own implicit status-to-commit association is correct
      # here -- no need to route around it.
      - name: Check UI evidence (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/supervisor/ui-evidence-gate.sh "${{ github.event.pull_request.number }}"
      # issue_comment: see the #468 correction above -- publish the result
      # explicitly against the PR's real head SHA instead of trusting the
      # run's own (wrong) head_sha.
      - name: Check UI evidence (issue_comment, explicit head SHA)
        if: github.event_name == 'issue_comment'
        run: |
          bash scripts/supervisor/ui-evidence-report.sh "${{ github.event.issue.number }}"
